[package]
name = "lbreco"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native desktop music discovery app powered by ListenBrainz and an optional AI curator"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
glib = "0.22"
gio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-channel = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit6 = "0.6"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
strip = true
